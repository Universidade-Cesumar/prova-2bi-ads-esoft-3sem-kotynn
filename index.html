<!DOCTYPE html>
<html lang=pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>
    <header>
        <h1> SISTEMA DE ESTOQUE - enfermagem</h1>
        <p> Responsável: <strong> Enfermeira Camila</strong></p>
    </header>
    <main>
            <!-- Criando dashboard maneiro -->
            <section id= "dashboard">
                <h2>dashboard</h2>
                <p> Total de Itens: <strong id= "total-itens">0</strong></p>
            </section>

            <section>
                <h2>Cadastrar Material</h2>

                <label for="input-nome">Nome do Material</label>
                <input type="text" id="input-nome" placeholder="Ex: Luvas de procedimento">

                <label for="input-quantidade">Quantidade</label>
                <input type="number" id="input-quantidade" placeholder="Ex: 100" min="0">

                <button id="btn-cadastrar">Gravar no Inventário</button>
                <p id="mensagem"></p>
            </section>

            <section>
                <h2>Inventário</h2>
    </main>
</body>
</html>

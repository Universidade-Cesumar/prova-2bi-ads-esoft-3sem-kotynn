<!DOCTYPE html>
<html lang=pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Prova do Leo</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>
    <header>
        <h1> SISTEMA DE ESTOQUE - enfermagem</h1>
        <p> Responsável: <strong> Enfermeira Camila</strong></p>
    </header>
    <main>
            <!-- Criando dashboard maneiro -->
            <section id= "dashboard">
                <h2>dashboard</h2>
                <p> Total de Itens: <strong id= "total-itens">27</strong></p>
            </section>

            <section>
                <h2>Cadastrar Material</h2>

                <label for="input-nome">Nome do Material</label>
                <input type="text" id="input-nome" placeholder="Ex: Luvas de procedimento">

                <label for="input-quantidade">Quantidade no estoque</label>
                <input type="number" id="input-quantidade" placeholder="Ex: 100" min="0">

                <button id="btn-cadastrar">Cadastrar no Inventário</button>
                <p id="mensagem"></p>
            </section>

            <section>
                <h2>Inventário</h2>

                <table>
                <thead>
                    <tr>
                    <th>#</th>
                    <th>Material</th>
                    <th>Quantidade</th>
                    <th>Cadastro</th>
                    </tr>
                </thead>
                <tbody id="lista-materiais">
                    <tr><td colspan="5" class="vazio">Aguande um pouco rsrs...</td></tr>
                </tbody>
                </table>
            </section>
</main>
<script src="main.js"></script>

</body>
</html>
